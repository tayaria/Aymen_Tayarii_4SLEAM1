<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Liste des Departments</title>
    <style>
        table { border-collapse: collapse; width: 70%; margin: auto; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        h1 { text-align: center; }
    </style>
</head>
<body>
<h1>Liste des Departments</h1>
<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Nom</th>
        <th>Location</th>
        <th>Phone</th>
        <th>Head</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="dep : ${departments}">
        <td th:text="${dep.idDepartment}"></td>
        <td th:text="${dep.name}"></td>
        <td th:text="${dep.location}"></td>
        <td th:text="${dep.phone}"></td>
        <td th:text="${dep.head}"></td>
    </tr>
    </tbody>
</table>
</body>
</html>
